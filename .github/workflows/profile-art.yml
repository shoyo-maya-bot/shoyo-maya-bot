# プロフィールの 3D 草グラフとヘビのアニメを作り直す（1 日 1 回と手動）。
# 変わったときだけ main にコミットする。
name: profile-art

on:
  schedule:
    - cron: "17 18 * * *" # 毎日 3:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 3D の草グラフ
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: ヘビのアニメ
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: 変わっていればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib dist
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "プロフィールの草グラフを更新"
            git push
          fi
